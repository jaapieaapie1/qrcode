name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace (default features)
        run: cargo test --workspace
      - name: Test workspace (no default features)
        run: cargo test --workspace --no-default-features
      # Workspace feature unification keeps qr-core's `micro` on via
      # tests-integration/qr-video defaults, so test the true micro-off
      # build of the foundation crate on its own.
      - name: Test qr-core with micro off
        run: cargo test -p qr-core --no-default-features
      # The `no_std` shape of the detector, run rather than merely checked. The
      # library is `#![no_std]` here — no `image`, hand-rolled float math — but
      # the host test harness links `std` around it, so the entire existing
      # detection corpus executes against the exact code the ESP32 target gets.
      - name: Test qr-detect as no_std
        run: cargo test -p qr-detect --no-default-features --features decode,micro
      # The same substitution the other way round: `std` and `image` present,
      # but the whole pipeline routed through the hand-rolled `mathf`. That puts
      # the cross-crate suites in tests-integration and qr-video — warp, fuzz,
      # multiscan, video tracking — on the bare-metal arithmetic too, which is
      # what makes "the two paths reach the same detections" a tested claim
      # rather than an assumption about ulps.
      - name: Test workspace on the hand-rolled float path
        # The trailing exact-name test only exists under the cfg; grepping for
        # its result keeps a misspelled --cfg from turning this lane into a
        # silently green no-op (check-cfg cannot catch command-line typos).
        run: |
          cargo test --workspace
          cargo test -p qr-detect --lib soft_float_lane_is_live \
            | grep -q 'test result: ok. 1 passed'
        env:
          RUSTFLAGS: -D warnings --cfg qr_detect_soft_float

  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Clippy (detector as no_std)
        run: cargo clippy -p qr-detect --all-targets --no-default-features --features decode,micro -- -D warnings

  bench-smoke:
    name: Benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This is a build-and-run gate, not a performance gate. BENCH_QUICK cuts
      # every bench to three iterations, so the job proves the bench targets
      # compile, their in-code fixtures still assert clean (right version, right
      # decoded payload, right detection count) and every bench runs to
      # completion. Timings from a shared CI runner are not comparable between
      # runs, so nothing here is thresholded — the baseline in
      # benchmarks/README.md is measured on a known machine instead.
      - name: Run bench suite in smoke mode
        run: BENCH_QUICK=1 cargo bench -p benchmarks

  cross-targets:
    name: Cross-target checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, riscv32imc-unknown-none-elf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: no_std crates on bare-metal ARM (Cortex-M)
        run: cargo check -p qr-core -p qr-encode -p qr-decode --target thumbv7em-none-eabihf
      - name: no_std crates on bare-metal RISC-V (ESP32-C3 class)
        run: cargo check -p qr-core -p qr-encode -p qr-decode --target riscv32imc-unknown-none-elf
      - name: no_std crates without default features (bare-metal ARM)
        run: cargo check -p qr-core -p qr-encode -p qr-decode --no-default-features --target thumbv7em-none-eabihf
      # qr-detect needs its own lines: `std` is on by default there (it carries
      # the optional `image` dependency), so unlike the three above it has to be
      # asked for the bare-metal shape explicitly. The feature set named here is
      # the one esp-selftest links, so this step and the QEMU job below check
      # and then execute the same build.
      - name: Detector on bare-metal ARM (Cortex-M)
        run: cargo check -p qr-detect --no-default-features --features decode,micro --target thumbv7em-none-eabihf
      - name: Detector on bare-metal RISC-V (ESP32-C3 class)
        run: cargo check -p qr-detect --no-default-features --features decode,micro --target riscv32imc-unknown-none-elf
      # Detection-only and micro-off shapes, so a feature combination cannot rot
      # into a dead-code or missing-import failure unnoticed.
      - name: Detector on bare-metal ARM, no optional features
        run: cargo check -p qr-detect --no-default-features --target thumbv7em-none-eabihf
      - name: All crates on wasm32
        run: cargo check -p qr-core -p qr-encode -p qr-decode -p qr-detect -p qr-render -p qr-video --target wasm32-unknown-unknown

  demo-build:
    name: Browser demo (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: demo-wasm
      - name: Install wasm-pack
        run: |
          curl -sSfL https://github.com/rustwasm/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/wasm-pack'
          wasm-pack --version
      # demo-wasm is excluded from the workspace, so neither the `lint` job's
      # `cargo fmt --all` nor its `cargo clippy --workspace` can see it.
      - name: fmt
        working-directory: demo-wasm
        run: cargo fmt --check
      - name: Clippy
        working-directory: demo-wasm
        run: cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
      - name: Build demo to wasm + JS bindings
        working-directory: demo-wasm
        run: wasm-pack build --release --target web --out-dir www/pkg
      - name: Check the page's assets point at the build output
        working-directory: demo-wasm/www
        run: |
          test -f pkg/qr_demo.js
          test -f pkg/qr_demo_bg.wasm
          grep -q "./pkg/qr_demo.js" app.js
      # Deploys the built demo to Cloudflare Pages on pushes to main, and only
      # once the two secrets exist — until then the step is skipped and the job
      # stays green. Setup (one time):
      #   1. Cloudflare dashboard -> Workers & Pages -> create Pages project
      #      named `qrcode-demo` (direct upload).
      #   2. Repo settings -> secrets -> add CLOUDFLARE_API_TOKEN (Pages:Edit)
      #      and CLOUDFLARE_ACCOUNT_ID.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAVE_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy demo-wasm/www --project-name=qrcode-demo
    env:
      HAVE_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

  esp32-emulation:
    name: ESP32-class execution (QEMU riscv32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: esp-selftest
      - name: Install qemu-system-riscv32
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc
          qemu-system-riscv32 --version
      # esp-selftest is excluded from the workspace, so neither the `lint` job's
      # `cargo fmt --all` nor its `cargo clippy --workspace` can see it.
      - name: fmt
        working-directory: esp-selftest
        run: cargo fmt --check
      - name: Clippy
        working-directory: esp-selftest
        run: cargo clippy --release -- -D warnings
      - name: Build bare-metal self-test
        working-directory: esp-selftest
        run: cargo build --release
      - name: Run self-test on emulated riscv32
        working-directory: esp-selftest
        run: |
          set -o pipefail
          timeout 120 qemu-system-riscv32 \
            -machine virt -nographic -bios none \
            -kernel target/riscv32imc-unknown-none-elf/release/esp-selftest \
            | tee run.log
          # The SiFive test finisher gives QEMU its exit status, which the
          # pipefail above propagates. Insist on the banner too, so a QEMU that
          # ignored the finisher or a run killed by `timeout` cannot pass.
          grep -q '^ALL PASS' run.log
          # And on the detection suite's own line, so a suite that stopped being
          # run cannot pass by simply not failing.
          grep -q '320x240 luma frame' run.log
          grep -q '^heap peak' run.log

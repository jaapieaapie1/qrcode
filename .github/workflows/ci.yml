name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace (default features)
        run: cargo test --workspace
      - name: Test workspace (no default features)
        run: cargo test --workspace --no-default-features

  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  cross-targets:
    name: Cross-target checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, riscv32imc-unknown-none-elf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: no_std crates on bare-metal ARM (Cortex-M)
        run: cargo check -p qr-core -p qr-encode -p qr-decode --target thumbv7em-none-eabihf
      - name: no_std crates on bare-metal RISC-V (ESP32-C3 class)
        run: cargo check -p qr-core -p qr-encode -p qr-decode --target riscv32imc-unknown-none-elf
      - name: no_std crates without default features (bare-metal ARM)
        run: cargo check -p qr-core -p qr-encode -p qr-decode --no-default-features --target thumbv7em-none-eabihf
      - name: All crates on wasm32
        run: cargo check -p qr-core -p qr-encode -p qr-decode -p qr-detect -p qr-render -p qr-video --target wasm32-unknown-unknown

  esp32-emulation:
    name: ESP32-class execution (QEMU riscv32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: esp-selftest
      - name: Install qemu-system-riscv32
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc
          qemu-system-riscv32 --version
      # esp-selftest is excluded from the workspace, so neither the `lint` job's
      # `cargo fmt --all` nor its `cargo clippy --workspace` can see it.
      - name: fmt
        working-directory: esp-selftest
        run: cargo fmt --check
      - name: Clippy
        working-directory: esp-selftest
        run: cargo clippy --release -- -D warnings
      - name: Build bare-metal self-test
        working-directory: esp-selftest
        run: cargo build --release
      - name: Run self-test on emulated riscv32
        working-directory: esp-selftest
        run: |
          set -o pipefail
          timeout 120 qemu-system-riscv32 \
            -machine virt -nographic -bios none \
            -kernel target/riscv32imc-unknown-none-elf/release/esp-selftest \
            | tee run.log
          # The SiFive test finisher gives QEMU its exit status, which the
          # pipefail above propagates. Insist on the banner too, so a QEMU that
          # ignored the finisher or a run killed by `timeout` cannot pass.
          grep -q '^ALL PASS' run.log

[package]
name = "esp-selftest"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Deliberately outside the workspace (see the root `exclude`): this crate only
# ever builds for `riscv32imc-unknown-none-elf` and links against a linker
# script, so it must not be swept up by `cargo test --workspace` or by the
# host-target lint jobs.

[dependencies]
# Default features on, so `micro` is exercised exactly as an ESP32-C3 firmware
# would get it from crates.io.
qr-core = { path = "../crates/qr-core" }
qr-encode = { path = "../crates/qr-encode" }
qr-decode = { path = "../crates/qr-decode" }
# The detector is the one crate whose defaults must be turned off: `std` is on
# by default there (it is what carries the `image` dependency), and this target
# has neither. `decode` and `micro` are the two the firmware exercises, so they
# are named back explicitly — which is also the exact feature set the CI
# cross-target job checks.
qr-detect = { path = "../crates/qr-detect", default-features = false, features = [
    "decode",
    "micro",
] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
